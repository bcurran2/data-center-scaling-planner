name: Publish runnable notebook

# Builds a JupyterLite site that runs dc_scaling_planner.ipynb in the visitor's
# browser (Python via Pyodide), and publishes it with GitHub Pages.
# Needs Settings > Pages > Source set to "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - dc_scaling_planner.ipynb
      - .github/workflows/jupyterlite.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install JupyterLite
        run: python -m pip install jupyterlite-core jupyterlite-pyodide-kernel
      - name: Build the site
        run: jupyter lite build --contents dc_scaling_planner.ipynb --output-dir dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
